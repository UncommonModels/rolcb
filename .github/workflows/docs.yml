name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nightly for `--cfg docsrs` / `doc_cfg`, so feature badges render like docs.rs.
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (libudev for the serial feature)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Run doctests (guide examples included)
        run: cargo test --doc --all-features

      # Builds with nightly + `--cfg docsrs` (warnings are errors) and puts the
      # crate at the site root (/rolcb/... not /rolcb/rolcb/...) in target/site.
      - name: Build docs site
        run: bash scripts/build-docs.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
