# Prebuilt `rolcb-hub` binaries.
#
# - Pushing a tag like `v0.2.0` builds the hub for each platform below and
#   attaches the archives (plus SHA256SUMS) to a GitHub release for that tag.
# - nightly.yml calls this with `channel: nightly` to replace the `nightly`
#   pre-release with a fresh build of main.
# - Running it by hand builds the same archives as workflow artifacts without
#   publishing anything (a dry run).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        description: "release (tags), nightly, or dev (dry run)"
        type: string
        default: dev

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl builds run on any Linux distro, including Raspberry Pi OS.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          tool=cargo
          [ "${{ matrix.cross }}" = "true" ] && tool=cross
          $tool build --release --locked --features cli,serial --bin rolcb-hub --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          if [ "${{ inputs.channel }}" = "nightly" ]; then
            version="nightly-$(date -u +%Y%m%d)"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          name="rolcb-hub-${version}-${{ matrix.target }}"
          mkdir "$name"
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/rolcb-hub${ext}" README.md LICENSE "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$name.tar.gz" "$name"
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag' || inputs.channel == 'nightly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish nightly pre-release
        if: inputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Automated testing build of \`${GITHUB_SHA::7}\` from $(date -u '+%Y-%m-%d %H:%M UTC'). Untested: use a numbered release for anything that matters."

      - name: Publish release
        if: github.ref_type == 'tag' && inputs.channel != 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "rolcb $TAG" --generate-notes
          fi
